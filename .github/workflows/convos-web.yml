name: Convos Web

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev

  pull_request:

jobs:
  setup:
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "yarn"
        env:
          SKIP_YARN_COREPACK_CHECK: "1"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn
      - name: Generate
        run: yarn generate
      - name: Build
        run: yarn build
      - name: Cache workspace
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            src/gen
            src/routeTree.gen.ts
          key: workspace-${{ github.sha }}

  validate:
    needs: setup
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
        env:
          SKIP_YARN_COREPACK_CHECK: "1"
      - name: Enable corepack
        run: corepack enable
      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            src/gen
            src/routeTree.gen.ts
          key: workspace-${{ github.sha }}
      - name: Lint
        run: yarn lint
      - name: Format check
        run: yarn format:check
      # - name: Run tests
      #   run: yarn test
